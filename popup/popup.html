<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Pulse</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 data-i18n="extName">Market Pulse</h1>
    <div class="actions">
      <button id="refresh" data-i18n-title="refreshNow" data-i18n-aria="refreshNow">⟳</button>
      <button id="settings" data-i18n-title="settings" data-i18n-aria="settings">⚙</button>
    </div>
  </header>

  <section id="markets" class="markets" data-i18n-aria="marketsStatus"></section>
  <main id="content"></main>

  <footer>
    <span id="status">—</span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
